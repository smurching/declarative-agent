bundle:
  name: agent-backend

variables:
  database_instance_name:
    default: "agent-backend-db"
  serving_endpoint_name:
    default: "databricks-gpt-5-2"
  resource_name_suffix:
    default: "${bundle.target}"
  backend_app_url:
    description: "Backend app URL (set after backend deployment)"
    default: ""

resources:
  # Lakebase (Postgres) database instance
  database_instances:
    agent_db:
      name: ${var.database_instance_name}-${var.resource_name_suffix}
      capacity: CU_1

  # Databricks Apps
  apps:
    # Backend app - provides /responses API
    agent_backend:
      name: "${bundle.target}-agent-backend"
      description: "Agent backend with OpenResponses API support"
      source_code_path: ./

      # Resources this app has access to
      resources:
        - name: serving-endpoint
          serving_endpoint:
            name: ${var.serving_endpoint_name}
            permission: CAN_QUERY

        - name: database
          database:
            database_name: databricks_postgres
            instance_name: ${resources.database_instances.agent_db.name}
            permission: CAN_CONNECT_AND_CREATE

    # Agent app - hosts data_analyst agent, calls backend
    data_analyst_agent:
      name: "${bundle.target}-data-analyst"
      description: "Data analyst agent with SQL and Python tools"
      source_code_path: ./agent_app
      config:
        command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
        env:
          - name: BACKEND_APP_URL
            value: "https://dev-agent-backend-3217006663075879.aws.databricksapps.com"
          # ALLOWED_API_KEY removed - using Databricks OAuth permissions instead

      # Grant UI app permission to call this agent
      permissions:
        - service_principal_name: "app-2sbfjd db-chatbot-dev-sid-murching"
          level: CAN_USE

targets:
  dev:
    mode: development
    default: true
    variables:
      resource_name_suffix: "dev"

  dogfood:
    mode: development
    workspace:
      profile: dogfood
    variables:
      resource_name_suffix: "dogfood"

  prod:
    mode: production
    variables:
      resource_name_suffix: "prod"
    resources:
      apps:
        agent_backend:
          name: agent-backend-prod
