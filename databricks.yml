bundle:
  name: agent-backend

variables:
  database_instance_name:
    default: "agent-backend-db"
  serving_endpoint_name:
    default: "databricks-gpt-5-2"
  resource_name_suffix:
    default: "${bundle.target}"

resources:
  # Lakebase (Postgres) database instance
  database_instances:
    agent_db:
      name: ${var.database_instance_name}-${var.resource_name_suffix}
      capacity: CU_1

  # Databricks App
  apps:
    agent_backend:
      name: "${bundle.target}-agent-backend"
      description: "Agent backend with OpenResponses API support"
      source_code_path: ./

      # Resources this app has access to
      resources:
        - name: serving-endpoint
          serving_endpoint:
            name: ${var.serving_endpoint_name}
            permission: CAN_QUERY

        - name: database
          database:
            database_name: databricks_postgres
            instance_name: ${resources.database_instances.agent_db.name}
            permission: CAN_CONNECT_AND_CREATE

targets:
  dev:
    mode: development
    default: true
    variables:
      resource_name_suffix: "dev"

  prod:
    mode: production
    variables:
      resource_name_suffix: "prod"
    resources:
      apps:
        agent_backend:
          name: agent-backend-prod
