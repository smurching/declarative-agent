# Databricks App configuration for declarative agent
# This app uses the declarative-agent CLI to serve an agent from YAML

command:
  - "declarative-agent"
  - "serve"
  - "my_agent.yaml"
  - "--backend-url"
  - "${BACKEND_URL}"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"

env:
  - name: DATABRICKS_CLI_PROFILE
    value: "default"
  - name: WORKSPACE_ID
    value: "${var.workspace_id}"
  - name: BACKEND_URL
    value: "https://${var.backend_app_name}.databricksapps.com"

# Resources this app depends on
resources:
  - name: backend-app
    description: "Backend API for agent execution"
    app:
      name: "${var.backend_app_name}"
      permission: CAN_USE
