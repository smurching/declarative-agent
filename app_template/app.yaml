# Databricks App configuration for declarative agent
# This app uses the declarative-agent CLI to serve an agent from YAML

command:
  - "declarative-agent"
  - "serve"
  - "data_analyst.yaml"
  - "--backend-url"
  - "https://dev-agent-backend-3217006663075879.aws.databricksapps.com"
  - "--host"
  - "0.0.0.0"
  - "--port"
  - "8000"
  - "--no-backend"

env:
  - name: DATABRICKS_CLI_PROFILE
    value: "default"
