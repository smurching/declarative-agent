[project]
name = "declarative-agent"
version = "0.1.4"
description = "Build and deploy AI agents with YAML - no code required"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",  # For local SQLite support
    "databricks-sdk>=0.40.0",
    "databricks-openai>=0.3.0",
    "python-dotenv>=1.0.1",
    "alembic>=1.13.3",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.1",
    "httpx>=0.27.2",  # For streaming HTTP client in AgentRunner
    "pyyaml>=6.0",  # For YAML config parsing
    "click>=8.1.0",  # CLI framework
    "psutil>=5.9.0",  # Process management
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
declarative-agent = "declarative_agent.cli.main:cli"

[tool.setuptools.packages.find]
where = ["sdk", "."]
include = ["declarative_agent*", "server*", "agent_app*"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
    "openai>=1.0.0",
]
